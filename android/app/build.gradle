plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.learnhubplatform.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.learnhubplatform.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // IMPORTANT: Fill this in locally using local.properties — never commit passwords to git
        // release {
        //     storeFile file(keystorePath)
        //     storePassword keystorePassword
        //     keyAlias keyAlias
        //     keyPassword keyPassword
        // }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release  // uncomment after configuring keystore
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // AndroidX Core (Kotlin)
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // ── TWA: Trusted Web Activity (CORE) ─────────────────────────────────────
    // Official Google Android Browser Helper — the recommended TWA library
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'

    // Splash Screen API (backported to Android 5.0+)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Network
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
