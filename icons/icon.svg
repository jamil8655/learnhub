<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Decorative Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="url(#haloGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Islamic Geometric 8-point Star Frame -->
  <g transform="translate(256, 256)">
    <rect x="-135" y="-135" width="270" height="270" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.85"/>
    <rect x="-135" y="-135" width="270" height="270" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.85" transform="rotate(45)"/>
  </g>

  <!-- Central Emblem: Graduation Cap + Open Quran Book -->
  <g filter="url(#glow)">
    <!-- Graduation Cap Top (Diamond) -->
    <polygon points="256,155 376,215 256,275 136,215" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Cap Skull Base -->
    <path d="M 188,225 Q 256,260 324,225 L 324,250 Q 256,285 188,250 Z" fill="#10b981"/>

    <!-- Tassel and Golden Pearl -->
    <path d="M 256,215 Q 310,230 350,265" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="352" cy="268" r="9" fill="url(#goldGrad)"/>
    <path d="M 352,274 L 350,305 M 352,274 L 354,305 M 352,274 L 356,303" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Open Quran Pages -->
    <path d="M 160,335 Q 210,310 256,335 Q 302,310 352,335 L 352,360 Q 302,335 256,360 Q 210,335 160,360 Z" fill="#34d399" opacity="0.95"/>
    <path d="M 256,335 L 256,362" stroke="#064e3b" stroke-width="3"/>
  </g>
</svg>
