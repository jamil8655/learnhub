<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آف لائن — LearnHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 400px; }
    .icon-wrap {
      width: 100px; height: 100px;
      background: #059669;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 40px rgba(5,150,105,0.4);
    }
    .icon-wrap svg { width: 52px; height: 52px; fill: white; }
    h1 { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .subtitle { font-size: 0.9rem; color: #94a3b8; line-height: 1.6; margin-bottom: 32px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #131929; border: 1px solid #1e293b;
      border-radius: 50px; padding: 8px 18px;
      color: #ef4444; font-size: 0.85rem; margin-bottom: 32px;
    }
    .badge::before { content: "●"; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #059669; color: white;
      border: none; border-radius: 14px;
      padding: 14px 32px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: #047857; }
    .app-name { margin-top: 40px; color: #059669; font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M19 1H5C3.9 1 3 1.9 3 3v18l4-4h12c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 15H6.17L5 17.17V3h14v13z"/></svg>
    </div>
    <div class="badge">آف لائن</div>
    <h1>انٹرنیٹ کنکشن نہیں</h1>
    <p class="subtitle">
      LearnHub استعمال کے لیے انٹرنیٹ کنکشن ضروری ہے۔<br>
      برائے کرم اپنا کنکشن چیک کریں اور دوبارہ کوشش کریں۔
    </p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      دوبارہ کوشش کریں
    </button>
    <div class="app-name">LearnHub</div>
  </div>
</body>
</html>
