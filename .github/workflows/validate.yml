name: LearnHub Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Validating $file"
            python -m json.tool "$file" >/dev/null
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Validate JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Validate HTML entry point
        shell: bash
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          echo 'Core web/PWA entry points are present.'
