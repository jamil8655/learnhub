name: LearnHub Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Validating $file"
            python -m json.tool "$file" >/dev/null
          done < <(find . -type f -name '*.json' \
            -not -path './.git/*' \
            -not -path './backend/vendor/*' \
            -not -path './android/.gradle/*' -print0)

      - name: Validate JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './android/*' \
            -not -path './backend/vendor/*' -print0)

      - name: Validate HTML/PWA entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.json
          test -s sw.js
          echo 'Core web/PWA entry points are present.'

      - name: Validate Laravel backend
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          test -s composer.json
          composer validate --no-check-publish --strict
          composer install --no-interaction --no-progress --prefer-dist
          find app config routes database tests -type f -name '*.php' -print0 | \
            while IFS= read -r -d '' file; do
              echo "Linting $file"
              php -l "$file" >/dev/null
            done
          php artisan test --without-tty
