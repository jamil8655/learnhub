name: LearnHub Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Audit Node dependencies when a lockfile exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo 'No package-lock.json; Node dependency audit skipped.'
          fi

      - name: Audit Laravel dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --abandoned=report

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript, php
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
